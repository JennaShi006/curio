services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: curio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curio_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-curio}
    ports:
      - "5432:5432"
    volumes:
      - curio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: curio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - curio_redis_data:/data

volumes:
  curio_pg_data:
  curio_redis_data:
